services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: taptot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: taptot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taptot -d taptot"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 2g

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      DEBUG: "false"
      PORT: "8080"
      DATABASE_URL: postgresql+psycopg://taptot:${POSTGRES_PASSWORD}@db:5432/taptot
      UPLOAD_DIR: /data/uploads
      RATE_LIMIT_TRUST_X_FORWARDED_FOR: "true"
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 2g

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: http://api:8080/api/v1
        NEXT_PUBLIC_MEDIA_BASE: /media
        NEXT_PUBLIC_REQUIRE_REDEEM_CODE: ${NEXT_PUBLIC_REQUIRE_REDEEM_CODE:-true}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        API_PROXY_TARGET: http://api:8080
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://api:8080
    depends_on:
      - api
    mem_limit: 1536m

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl.conf:/etc/nginx/conf.d/ssl.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - web
      - api

volumes:
  pgdata:
  uploads:
